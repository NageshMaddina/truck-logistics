name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore backend/TruckLogistics.sln
      - name: Build
        run: dotnet build backend/TruckLogistics.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test backend/TruckLogistics.sln --no-build --configuration Release
      - name: Check for model changes without a migration
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project backend/TruckLogistics.API --configuration Release --no-build

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      # CI=true (set by GitHub Actions) makes Create React App fail on lint warnings
      - name: Build
        run: npm run build
